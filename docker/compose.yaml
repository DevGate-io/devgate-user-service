name: devgate-user-service
services:
  db:
    image: 'postgres:latest'
    restart: unless-stopped
    env_file:
      - '../.env'
    ports:
      - '5433:5432'
    networks:
      - app_network
    volumes:
      - postgres_data:/var/lib/postgresql
  app:
    image: amazoncorretto:21.0.9
    container_name: devgate-user-service
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8081:8081"
    networks:
      - app_network
    volumes:
      - ../build/libs:/app
      - ../src/main/resources:/app/src/main/resources
    command: [ "java", "-jar", "/app/com.devgate.devgate-users.jar" ]
    depends_on:
      - db
networks:
  app_network:
    external: true

volumes:
  postgres_data: