rabbitmq:
  queue: audit.queue
  exchange: audit.exchange
  routingKey: audit.routingKey

spring:
  application:
    name: devgate-user-service

  docker:
    compose:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
  web:
    resources:
      add-mappings: false

server:
  port: 8081

logging:
  level:
    com:
      devgate:
        users: DEBUG
    org:
      hibernate:
        transaction: DEBUG
        sql: DEBUG
      springframework:
        transaction: DEBUG
  logback:
    rollingpolicy:
      file-name-pattern: "logs/application-%d{yyyy-MM-dd}.%i.log.gz"
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 3GB
      clean-history-on-start: false
  file:
    path: logs
    name: logs/app.log

jwt:
  secret: ${JWT_SECRET_BASE64}
  cookie:
    name: jwt-refresh-cookie
    secure: ${JWT_COOKIE_SECURE:false}
    same-site: ${JWT_COOKIE_SAME_SITE:Lax}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}