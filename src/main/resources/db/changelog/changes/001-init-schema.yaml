databaseChangeLog:
  - changeSet:
      id: 1768855504676-1
      author: progger
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - sql:
            sql: SELECT 'CREATE DATABASE devgate-users' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'devgate-users')
        - createTable:
            columns:
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_users
                  name: id
                  type: UUID
              - column:
                  constraints:
                    nullable: false
                  name: full_name
                  type: VARCHAR(255)
              - column:
                  name: last_login
                  type: DATETIME
              - column:
                  constraints:
                    nullable: false
                  name: role
                  type: VARCHAR(255)
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  constraints:
                    nullable: false
                  name: hashed_password
                  type: VARCHAR(255)
            tableName: users